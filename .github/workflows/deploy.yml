name: Deploy

# Only from a tag, and only as the bytes that were fully verified locally:
#   which app → secrets present → pin check → build → the build matches the
#   local verification record (releases/<app>.json) → live E2E → ario-deploy
#   (gzip, deduplicated Turbo upload + the ArNS record) → every served file
#   checked against the record → DEPLOYS.md, with the record's previous
#   target so a rollback is one record update.
#
# Releasing: on a clean checkout of the commit to ship,
#   node scripts/release.mjs verify <app> --version <x.y.z>
# then commit releases/<app>.json, merge, and tag that commit <app>-v<x.y.z>.
#
# Each ArNS name is controlled by its own Solana key, so each deploy runs in
# the GitHub environment for that name and reads only that environment's
# secrets. All four keys are Solana keys made for this repository; their
# secret halves are only in these secrets and on the machine that made them.
#
#   environment  names                        ARNS_KEY (added as the ANT's controller)   DEPLOY_KEY (Turbo credits shared to it)
#   arweave      cdb64, arweave-l1-search     2EzGpd5ZyyGz8mq9kTMdnzcG1uHevp26nb1GMsfcKDHH  5KA6ouQbFcwwKRHGF4troiXh4RjXYResoivnqBqsSZos
#   ardrive      ardrive (undername explore)  28aWqmK1tNyC7apxxPNU1jSy4PWAVzpCzwnWA6gdxrs4  38V1fCRzp3KAz4TQY4UkD9SiqqkGXNZkbm7buCo5oTSR
#
# Both secrets are base58 Solana secret keys. The ARNS_KEY pays the Solana
# fees of the record update, so it holds a little SOL. The DEPLOY_KEY pays
# for the upload from credits shared to it. A controller can set every record
# of its name, `@` included, so the ardrive environment's key can change
# ardrive.ar.io itself: give that environment required reviewers.
on:
  push:
    tags:
      - 'ardrive-explorer-v*'
      - 'arweave-l1-explorer-v*'
      - 'network-index-v*'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app.outputs.app }}
      version: ${{ steps.app.outputs.version }}
      environment: ${{ steps.app.outputs.environment }}
      arns: ${{ steps.app.outputs.arns }}
      undername: ${{ steps.app.outputs.undername }}
      url: ${{ steps.app.outputs.url }}
    steps:
      - name: Which app, name and environment
        id: app
        run: |
          tag="${GITHUB_REF_NAME}"
          app="${tag%-v*}"
          {
            echo "app=${app}"
            echo "version=${tag##*-v}"
            case "$app" in
              ardrive-explorer)    echo "environment=ardrive"; echo "arns=ardrive";            echo "undername=explore"; echo "url=https://explore_ardrive.ar.io" ;;
              arweave-l1-explorer) echo "environment=arweave"; echo "arns=arweave-l1-search";  echo "undername=@";       echo "url=https://arweave-l1-search.ar.io" ;;
              network-index)       echo "environment=arweave"; echo "arns=cdb64";              echo "undername=@";       echo "url=https://cdb64.ar.io" ;;
              *) echo "unknown app $app" >&2; exit 1 ;;
            esac
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    permissions:
      contents: write
    env:
      APP: ${{ needs.plan.outputs.app }}
      URL: ${{ needs.plan.outputs.url }}
    steps:
      - name: Secrets present
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          ARNS_KEY: ${{ secrets.ARNS_KEY }}
        run: |
          missing=""
          [ -n "$DEPLOY_KEY" ] || missing="$missing DEPLOY_KEY"
          [ -n "$ARNS_KEY" ] || missing="$missing ARNS_KEY"
          if [ -n "$missing" ]; then
            echo "::error::environment ${{ needs.plan.outputs.environment }} lacks:$missing"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pins:check
      - name: Build every app (the live suites open all three)
        run: pnpm --filter "./apps/*" run build
      - name: The build is the locally verified release
        run: node scripts/release.mjs check "$APP" --version "${{ needs.plan.outputs.version }}"
      - run: npx playwright install --with-deps chromium
      - name: Live E2E of this app on this commit
        run: pnpm e2e:live $(node scripts/release.mjs specs "$APP")
        env:
          GW: https://turbo-gateway.com
      - name: What the name points at now (the rollback target)
        id: before
        run: |
          prev=$(curl -s -o /dev/null -D - --max-time 30 "$URL/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-arns-resolved-id"{print $2}')
          echo "previous=${prev:-none}" >> "$GITHUB_OUTPUT"
          echo "$URL resolves to ${prev:-nothing}"
      - name: Upload with Turbo and set the ArNS record
        id: deploy
        uses: ar-io/ar-io-deploy@v2.1.1
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY }}
          sig-type: solana
          arns-key: ${{ secrets.ARNS_KEY }}
          arns-name: ${{ needs.plan.outputs.arns }}
          undername: ${{ needs.plan.outputs.undername }}
          deploy-folder: apps/${{ needs.plan.outputs.app }}/dist
          fallback-file: index.html
          ttl-seconds: '900'
          # gzip every compressible file (gateways serve it with
          # Content-Encoding; browsers decompress), and pay only for files
          # not already on Arweave: the Actions cache of a tag run can't see
          # the last tag's, so incremental finds past uploads by content hash.
          compress: gzip
          incremental: 'true'
      - name: Every served file is the verified bytes, and the name points at it
        run: |
          node scripts/release.mjs remote "$APP" --manifest "${{ steps.deploy.outputs.tx-id }}" --url "$URL" || {
            echo "::error::verification after upload failed. To roll back, point ${{ needs.plan.outputs.undername }} of ${{ needs.plan.outputs.arns }} at ${{ steps.before.outputs.previous }}"
            exit 1
          }
      - name: The deployed page works at its name
        run: |
          node scripts/release.mjs deployed "$APP" --url "https://turbo-gateway.com/${{ steps.deploy.outputs.tx-id }}/" &&
          node scripts/release.mjs deployed "$APP" --url "$URL" || {
            echo "::error::the deployed page failed its smoke test. To roll back, point ${{ needs.plan.outputs.undername }} of ${{ needs.plan.outputs.arns }} at ${{ steps.before.outputs.previous }}"
            exit 1
          }
      - name: Keep the E2E traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out-${{ github.ref_name }}
          path: e2e/out
          retention-days: 14
      - name: Record the manifest id on main
        # main's DEPLOYS.md, not the tag's: the tag may predate other deploys.
        # apps/*/dist is ignored by git, so it survives the checkout.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B record origin/main
          node scripts/record-deploy.mjs --app "$APP" --version "${{ needs.plan.outputs.version }}" \
            --manifest "${{ steps.deploy.outputs.tx-id }}" --url "$URL" --previous "${{ steps.before.outputs.previous }}" \
            --commit "${GITHUB_SHA::7}"
          git add DEPLOYS.md
          git commit -m "deploy(${APP}): ${{ needs.plan.outputs.version }} is ${{ steps.deploy.outputs.tx-id }}"
          git push origin HEAD:main
