name: Live E2E

# The same suites, against turbo-gateway.com's live publication, with the
# production build. Numbers in the log are the acceptance table's. Run by
# hand from the Actions tab; every deploy already runs its app's live suites
# before it uploads.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm --filter "./apps/*" run build
      - run: pnpm e2e:live
        env:
          GW: https://turbo-gateway.com
          # A runner's network; see deploy.yml.
          PERF_FIRST_ROWS_S: '45'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-e2e-out
          path: |
            e2e/out
            e2e/report
          retention-days: 14
