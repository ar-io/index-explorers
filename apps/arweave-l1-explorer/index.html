<!doctype html>
<html lang="en" data-brand="ario">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arweave L1 Index Explorer</title>
    <link rel="canonical" href="https://arweave-l1-search.ar.io" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0a1c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Find any Arweave transaction, wallet or app in seconds, or query every base-layer transaction since 2018 with SQL in your browser. The index is signed by the gateway that built it, and every byte is checked before it is used."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Arweave L1 Index Explorer" />
    <meta
      property="og:description"
      content="Find any Arweave transaction, wallet or app in seconds, or query every base-layer transaction since 2018 with SQL in your browser. The index is signed by the gateway that built it, and every byte is checked before it is used."
    />
    <meta property="og:image" content="https://arweave-l1-search.ar.io/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Query Arweave's base layer. Verify every byte. Over 80 million transactions and 2 million blocks, 2018 to 2026."
    />
    <meta property="og:url" content="https://arweave-l1-search.ar.io" />
    <meta property="og:site_name" content="ar.io" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ar_io_network" />
    <meta name="twitter:title" content="Arweave L1 Index Explorer" />
    <meta
      name="twitter:description"
      content="Find any Arweave transaction, wallet or app in seconds, or query every base-layer transaction since 2018 with SQL in your browser. The index is signed by the gateway that built it, and every byte is checked before it is used."
    />
    <meta name="twitter:image" content="https://arweave-l1-search.ar.io/social.png" />
    <meta
      name="twitter:image:alt"
      content="Query Arweave's base layer. Verify every byte. Over 80 million transactions and 2 million blocks, 2018 to 2026."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Arweave L1 Index Explorer",
        "url": "https://arweave-l1-search.ar.io",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any browser",
        "browserRequirements": "WebAssembly and SubtleCrypto",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "publisher": { "@type": "Organization", "name": "ar.io", "url": "https://ar.io" },
        "description": "Query Arweave base-layer transactions with SQL in the browser, against a gateway's cryptographically signed parquet-l1 index.",
        "about": {
          "@type": "Dataset",
          "name": "parquet-l1",
          "description": "Arweave base-layer blocks and transactions as Apache Parquet, partitioned by block height and signed by the publishing gateway.",
          "encodingFormat": "application/vnd.apache.parquet",
          "isAccessibleForFree": true,
          "creator": { "@type": "Organization", "name": "ar.io" }
        }
      }
    </script>
  </head>
  <body>
    <div id="page"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
